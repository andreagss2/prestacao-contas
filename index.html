            <button onclick="fecharZoom()" class="absolute -top-12 right-0 text-white text-3xl font-bold rounded-full w-10 h-10 flex items-center justify-center cursor-pointer">✕</button>
            <img id="img-zoom-conteudo" src="" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl">

    <!-- PDF Area -->
    <div id="area-impressao"></div>

        <div class="max-w-md mx-auto">
            <h1 class="text-xl font-bold mb-1 text-center">Prestação de Contas</h1>

            <div id="status-sync" class="text-center mb-4">
                <p class="text-xs text-purple-200" id="texto-status-nuvem">☁️ Conectando ao Banco de Dados...</p>

            <div class="grid grid-cols-2 gap-2 mb-4">

                    <label class="block text-[10px] text-purple-200 uppercase font-bold tracking-wider mb-1 truncate">Mês Ref.</label>
                    <div class="relative bg-purple-800 border border-purple-500 rounded-lg h-[42px] flex items-center justify-between px-2 cursor-pointer hover:bg-purple-600 transition overflow-hidden">

                    <div>

            <div id="lista-gastos" class="space-y-3"></div>

            </label>

        <div class="pt-2 flex flex-col space-y-3 nao-imprimir">
            <button onclick="gerarRelatorio()" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-3 px-6 rounded-xl text-sm transition shadow-md flex items-center justify-center space-x-2 cursor-pointer">

    <script>
        const SUPABASE_URL = "https://obrrlkaamytqwyobthig.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9icnJsa2FhbXl0cXd5b2J0aGlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2MDgxNDUsImV4cCI6MjEwMTE4NDE0NX0.-SgdDoz-EzToLnlkpEqxE1wdoHMl8v8q3nlkCsEdjPQ";
        
        let dadosApp = {};
        let imagemBase64Atual = '';
        let fotosExtrasArray = [];
        let statusConexaoBD = false;

        if(typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }

        // ===================== UI E NOTIFICAÇÕES =====================
        function mostrarToast(mensagem, icone = '✨') {

            document.getElementById('toast-icon').innerText = icone;
            document.getElementById('toast-msg').innerText = mensagem;

            setTimeout(() => toast.classList.add('-translate-y-24', 'opacity-0'), 3500);
        }

        function abrirZoom(src) {
            document.getElementById('img-zoom-conteudo').src = src;
            document.getElementById('modal-zoom').classList.remove('hidden');
            document.getElementById('modal-zoom').classList.add('flex');
        }
        function fecharZoom() {
            document.getElementById('modal-zoom').classList.add('hidden');
            document.getElementById('modal-zoom').classList.remove('flex');
        }

        function formatarMoeda(valor) { return (parseFloat(valor) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
        function formatarDataBR(iso) { if (!iso) return ''; const [a, m, d] = iso.split('-'); return `${d}/${m}/${a}`; }
        function escapeHtml(str) { const div = document.createElement('div'); div.innerText = str || ''; return div.innerHTML; }

        // ===================== CALENDÁRIO =====================
        const mesRefInput = document.getElementById('mes-ref');
        const mesDisplay = document.getElementById('mes-display-bonito');
        
        function getMesRefAtual() { return mesRefInput.value; }
        
        function formatarMesExtenso(YYYY_MM) {
            if(!YYYY_MM) return '';
            const [ano, mes] = YYYY_MM.split('-');
            const meses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

        }

        // Memória do Mês
        const ultimoMesAcessado = localStorage.getItem('ultimoMes_v4');

            mesRefInput.value = ultimoMesAcessado;
        } else {

            const m = String(hoje.getMonth() + 1).padStart(2, '0');
            mesRefInput.value = `${hoje.getFullYear()}-${m}`;
        }
        mesDisplay.innerText = formatarMesExtenso(mesRefInput.value);

        mesRefInput.addEventListener('change', (e) => {
            const novoMes = e.target.value;
            mesDisplay.innerText = formatarMesExtenso(novoMes);
            localStorage.setItem('ultimoMes_v4', novoMes);
            cancelarEdicao();
            renderizarTela();
            renderizarExtratoPreview();
        });


        // ===================== COMUNICAÇÃO COM O SUPABASE =====================
        async function carregarBancoSupabase() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/prestacao_contas?id=eq.1&select=dados`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                
                if(res.ok) {
                    const data = await res.json();
                    if(data.length > 0) dadosApp = data[0].dados || {};
                    document.getElementById('texto-status-nuvem').innerHTML = "✅ Banco de Dados Conectado";

                    renderizarExtratoPreview();

        async function salvarBancoSupabase() {
            document.getElementById('texto-status-nuvem').innerHTML = "⏳ Salvando...";
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/prestacao_contas?id=eq.1`, {
                    method: 'PATCH',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dados: dadosApp })
                });
                document.getElementById('texto-status-nuvem').innerHTML = "✅ Sincronizado";
            } catch(e) {
                mostrarToast("Erro ao salvar nuvem", "⚠️");
            }
        }

        async function fazerUploadImagemSupabase(base64DataUrl) {
            if (!base64DataUrl || !base64DataUrl.startsWith('data:')) return base64DataUrl;

            const arr = base64DataUrl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while(n--){ u8arr[n] = bstr.charCodeAt(n); }
            const blob = new Blob([u8arr], {type: mime});
            
            const ext = mime.split('/')[1] || 'jpg';
            const fileName = `foto_${Date.now()}_${Math.floor(Math.random()*1000)}.${ext}`;

            const res = await fetch(`${SUPABASE_URL}/storage/v1/object/arquivos/${fileName}`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': mime },
                body: blob
            });

            if (!res.ok) throw new Error("Falha no upload");
            return `${SUPABASE_URL}/storage/v1/object/public/arquivos/${fileName}`;
        }

        // ===================== PROCESSAMENTO (PDF / IMAGEM) =====================
        function comprimirImagem(file, maxWidth = 1400, quality = 0.75) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > maxWidth) { height = Math.round(height * (maxWidth / width)); width = maxWidth; }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function processarArquivoPDF(file, quality = 0.6) {
            const fileReader = new FileReader();
            return new Promise((resolve) => {
                fileReader.onload = async function() {
                    const typedarray = new Uint8Array(this.result);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let images = [];
                    for(let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const viewport = page.getViewport({scale: 1.2}); 
                        const canvas = document.createElement('canvas');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        await page.render({canvasContext: canvas.getContext('2d'), viewport: viewport}).promise;
                        images.push(canvas.toDataURL('image/jpeg', quality));
                    }
                    resolve(images);
                };
                fileReader.readAsArrayBuffer(file);
            });
        }

        // ===================== IA (GEMINI) =====================
        async function chamarIAComRetry(base64DataUrl, tentativa = 1) {
            const apiKey = localStorage.getItem('geminiApiKey');
            if (!apiKey) return null;
            
            const base64Data = base64DataUrl.split(',')[1];
            const promptSistema = 'Atue como assistente financeiro. Extraia: data (YYYY-MM-DD), valor (0.00), categoria, justificativa. Responda APENAS JSON PURO, sem aspas triplas.';
            const payload = {
                contents: [{ parts: [ { text: promptSistema }, { inlineData: { mimeType: 'image/jpeg', data: base64Data } } ] }],
                generationConfig: { responseMimeType: 'application/json' }
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error("Erro API");
                const data = await response.json();
                let text = data.candidates[0].content.parts[0].text || '{}';
                return JSON.parse(text.replace(/```json|```/g, '').trim());
            } catch (error) {
                if (tentativa <= 2) { await new Promise(r => setTimeout(r, 1000)); return chamarIAComRetry(base64DataUrl, tentativa + 1); }
                return null;
            }
        }

        // ===================== AÇÕES DE FORMULÁRIO =====================
        function removerFotoPrincipal() {
            imagemBase64Atual = ''; document.getElementById('img-preview').src = '';
            document.getElementById('preview-container').classList.add('hidden');
            document.getElementById('upload-placeholder').classList.remove('hidden');
            document.getElementById('foto-input').value = '';
        }

        document.getElementById('foto-input').addEventListener('change', async function (e) {
            const file = e.target.files[0];
            if (!file) return;
            mostrarToast('⏳ Processando arquivo...', '⚙️');
            
            let base64Result = '';
            if (file.type === 'application/pdf') {
                const pdfImages = await processarArquivoPDF(file);
                base64Result = pdfImages[0]; 
                if (pdfImages.length > 1) {
                    fotosExtrasArray.push(...pdfImages.slice(1)); renderizarExtrasPreview();
                    mostrarToast(`1ª página lida. ${pdfImages.length - 1} página(s) movida(s) para Anexos.`, '📑');
                }
            } else { base64Result = await comprimirImagem(file); }

            imagemBase64Atual = base64Result;
            document.getElementById('img-preview').src = base64Result;
            document.getElementById('preview-container').classList.remove('hidden');
            document.getElementById('upload-placeholder').classList.add('hidden');

            const apiKey = localStorage.getItem('geminiApiKey');
            if(apiKey) {
                mostrarToast('IA lendo o comprovante...', '🤖');
                const dados = await chamarIAComRetry(base64Result);
                if (dados) {
                    if (dados.data) document.getElementById('campo-data').value = dados.data;
                    if (dados.valor) document.getElementById('campo-valor').value = dados.valor;
                    if (dados.categoria) document.getElementById('campo-categoria').value = dados.categoria;
                    if (dados.justificativa) document.getElementById('campo-justificativa').value = dados.justificativa;
                    mostrarToast('Preenchido pela IA!', '✨');
                }
            }
        });

        function renderizarExtrasPreview() {
            const lista = document.getElementById('lista-extras-preview'); lista.innerHTML = '';
            fotosExtrasArray.forEach((src, idx) => {
                const wrapper = document.createElement('div'); wrapper.className = "relative";
                wrapper.innerHTML = `
                    <img src="${src}" class="w-14 h-14 object-cover rounded-lg border border-purple-200 cursor-pointer" onclick="abrirZoom('${src}')">
                    <button type="button" class="absolute -top-1.5 -right-1.5 bg-red-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center" onclick="removerFotoExtra(${idx})">✕</button>
                `;
                lista.appendChild(wrapper);
            });
        }
        function removerFotoExtra(idx) { fotosExtrasArray.splice(idx, 1); renderizarExtrasPreview(); }

        document.getElementById('fotos-extras-input').addEventListener('change', async function (e) {
            mostrarToast('⏳ Processando anexos...', '⚙️');
            for (const file of e.target.files) {
                if (file.type === 'application/pdf') { fotosExtrasArray.push(...await processarArquivoPDF(file)); } 
                else { fotosExtrasArray.push(await comprimirImagem(file)); }
            }
            renderizarExtrasPreview(); e.target.value = ''; mostrarToast('Anexos incluídos', '✅');
        });

        async function salvarGasto() {
            if(!statusConexaoBD) return mostrarToast('Aguarde a conexão com o banco de dados.', '⚠️');

            const mes = getMesRefAtual(); const editId = document.getElementById('edit-id').value;
            const dataVal = document.getElementById('campo-data').value;
            const valorVal = parseFloat(document.getElementById('campo-valor').value);
            const catVal = document.getElementById('campo-categoria').value.trim();
            const localVal = document.getElementById('campo-local').value.trim();
            const justVal = document.getElementById('campo-justificativa').value.trim();

            if (!dataVal || isNaN(valorVal) || !catVal || !justVal) return mostrarToast('Preencha Data, Valor, Categoria e Justificativa', '⚠️');
            
            const mesDaData = dataVal.substring(0, 7);
            if (mesDaData !== mes) {
                if (!confirm(`⚠️ ATENÇÃO!\nA data (${formatarDataBR(dataVal)}) diverge do mês (${formatarMesExtenso(mes)}).\n\nDeseja salvar mesmo assim?`)) return;
            }

            const btn = document.getElementById('btn-submit');
            btn.innerText = "⏳ Enviando Arquivos para a Nuvem..."; btn.disabled = true;

            try {
                let urlFoto = await fazerUploadImagemSupabase(imagemBase64Atual);
                let urlsExtras = [];
                for(let f of fotosExtrasArray) urlsExtras.push(await fazerUploadImagemSupabase(f));

                if (!dadosApp[mes]) dadosApp[mes] = { pensao: 0, gastos: [], extratos: [] };

                const dadosGasto = {
                    id: editId ? Number(editId) : Date.now(), data: dataVal, valor: valorVal, categoria: catVal, local: localVal, justificativa: justVal,
                    foto: urlFoto, fotosExtras: urlsExtras
                };

                if (editId) {
                    const idx = dadosApp[mes].gastos.findIndex(g => g.id === Number(editId));
                    if (idx !== -1) dadosApp[mes].gastos[idx] = dadosGasto;
                    mostrarToast('Atualizado!', '✏️');
                } else {
                    dadosApp[mes].gastos.push(dadosGasto);
                    mostrarToast('Salvo com sucesso!', '☁️');
                }

                await salvarBancoSupabase();
                cancelarEdicao(); renderizarTela();
            } catch (error) { mostrarToast('Falha no upload (Rede/Permissões)', '❌'); }
            
            btn.innerText = "Salvar na Nuvem"; btn.disabled = false;
        }

        function editarGasto(id) {
            const mes = getMesRefAtual(); const gasto = dadosApp[mes].gastos.find(g => g.id === id);
            if (!gasto) return;

            document.getElementById('edit-id').value = gasto.id;
            document.getElementById('campo-data').value = gasto.data;
            document.getElementById('campo-valor').value = gasto.valor;
            document.getElementById('campo-categoria').value = gasto.categoria;
            document.getElementById('campo-local').value = gasto.local || '';
            document.getElementById('campo-justificativa').value = gasto.justificativa;

            if (gasto.foto) {
                imagemBase64Atual = gasto.foto; document.getElementById('img-preview').src = gasto.foto;
                document.getElementById('preview-container').classList.remove('hidden');
                document.getElementById('upload-placeholder').classList.add('hidden');
            }

            fotosExtrasArray = gasto.fotosExtras ? [...gasto.fotosExtras] : []; renderizarExtrasPreview();
            document.getElementById('form-titulo').innerHTML = '<span>✏️ Editando</span>';
            document.getElementById('btn-submit').innerText = 'Salvar Alterações';
            document.getElementById('btn-cancelar-edicao').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicao() {
            document.getElementById('gasto-form').reset(); document.getElementById('edit-id').value = '';
            removerFotoPrincipal(); fotosExtrasArray = []; renderizarExtrasPreview();
            document.getElementById('form-titulo').innerHTML = '<span>📸 Novo Comprovante</span>';
            document.getElementById('btn-submit').innerText = 'Salvar na Nuvem';
            document.getElementById('btn-cancelar-edicao').classList.add('hidden');
        }

        async function deletarGasto(id) {
            if (confirm('Tem certeza que deseja excluir permanentemente?')) {
                dadosApp[getMesRefAtual()].gastos = dadosApp[getMesRefAtual()].gastos.filter(g => g.id !== id);
                mostrarToast('Excluindo...', '🗑️'); await salvarBancoSupabase(); renderizarTela();
            }
        }

        // ===================== PENSÃO E CÁLCULOS =====================
        const valorPensaInput = document.getElementById('valor-pensao');
        valorPensaInput.addEventListener('input', (e) => {
            const mes = getMesRefAtual();
            if (!dadosApp[mes]) dadosApp[mes] = { pensao: 0, gastos: [], extratos: [] };
            dadosApp[mes].pensao = parseFloat(e.target.value) || 0;
            atualizarResumo();
        });

        async function salvarPensao() { await salvarBancoSupabase(); }

        function atualizarResumo() {
            const mes = getMesRefAtual(); const info = dadosApp[mes] || { pensao: 0, gastos: [] };
            valorPensaInput.value = info.pensao || '';
            const totalGasto = info.gastos.reduce((a, c) => a + c.valor, 0);
            const saldo = (info.pensao || 0) - totalGasto;
            
            document.getElementById('resumo-gasto').innerText = formatarMoeda(totalGasto);
            const saldoEl = document.getElementById('resumo-saldo');
            saldoEl.innerText = formatarMoeda(saldo);
            saldoEl.className = "font-bold text-base transition-colors " + (saldo < 0 ? "text-red-300" : "text-white");
        }

        function renderizarTela() {
            const mes = getMesRefAtual(); const info = dadosApp[mes] || { pensao: 0, gastos: [] };
            const lista = document.getElementById('lista-gastos');
            document.getElementById('contador-itens').innerText = `${info.gastos.length} itens`;

            if (info.gastos.length === 0) { lista.innerHTML = `<div class="bg-white rounded-xl p-6 text-center border"><p class="text-xs text-gray-400">Nenhum gasto neste mês.</p></div>`; } 
            else {
                lista.innerHTML = '';
                info.gastos.slice().sort((a, b) => b.data.localeCompare(a.data)).forEach(gasto => {
                    const card = document.createElement('div'); card.className = "bg-white rounded-xl p-4 shadow-sm border border-gray-100";
                    let extrasHtml = '';
                    if (gasto.fotosExtras && gasto.fotosExtras.length > 0) {
                        extrasHtml = `<div class="mt-2 flex gap-2 flex-wrap">` + gasto.fotosExtras.map(ex => `<img src="${ex}" onclick="abrirZoom('${ex}')" class="w-12 h-12 object-cover rounded cursor-pointer border">`).join('') + `</div>`;
                    }
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="text-[10px] font-bold bg-purple-50 text-purple-700 px-2 py-0.5 rounded uppercase">${escapeHtml(gasto.categoria)}</span>
                                <h4 class="font-bold text-gray-800 text-sm mt-1">${escapeHtml(gasto.local)}</h4>
                                <p class="text-xs text-gray-500">${formatarDataBR(gasto.data)} • ${formatarMoeda(gasto.valor)}</p>
                            </div>
                            <div class="flex space-x-1">
                                <button onclick="editarGasto(${gasto.id})" class="text-gray-400 p-2 hover:bg-gray-100 rounded">✏️</button>
                                <button onclick="deletarGasto(${gasto.id})" class="text-red-400 p-2 hover:bg-red-50 rounded">🗑️</button>
                            </div>
                        </div>
                        <p class="text-xs text-gray-600 bg-gray-50 p-2 rounded italic">"${escapeHtml(gasto.justificativa)}"</p>
                        ${gasto.foto ? `<img src="${gasto.foto}" onclick="abrirZoom('${gasto.foto}')" class="w-full h-32 object-cover rounded mt-2 border cursor-pointer">` : ''}
                        ${extrasHtml}
                    `;
                    lista.appendChild(card);
                });
            }
            atualizarResumo();
        }

        // ===================== EXTRATO =====================
        async function renderizarExtratoPreview() {
            const mes = getMesRefAtual(); const extratos = (dadosApp[mes] && dadosApp[mes].extratos) || [];
            const lista = document.getElementById('lista-extrato-preview'); lista.innerHTML = '';
            extratos.forEach((url, idx) => {
                const div = document.createElement('div'); div.className = "relative";
                div.innerHTML = `<img src="${url}" class="w-16 h-16 object-cover rounded-lg border cursor-pointer" onclick="abrirZoom('${url}')"><button type="button" class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] w-4 h-4 rounded-full" onclick="removerExtrato(${idx})">✕</button>`;
                lista.appendChild(div);
            });
        }
        
        async function removerExtrato(idx) { dadosApp[getMesRefAtual()].extratos.splice(idx, 1); await salvarBancoSupabase(); renderizarExtratoPreview(); }

        document.getElementById('extrato-input').addEventListener('change', async function(e) {
            const mes = getMesRefAtual();
            if (!dadosApp[mes]) dadosApp[mes] = { pensao: 0, gastos: [], extratos: [] };
            if (!dadosApp[mes].extratos) dadosApp[mes].extratos = [];
            mostrarToast("⏳ Fazendo upload do Extrato...", "☁️");
            
            for (const file of e.target.files) {
                let imagensBase64 = file.type === 'application/pdf' ? await processarArquivoPDF(file, 0.8) : [await comprimirImagem(file, 1600, 0.8)];
                for (let b64 of imagensBase64) {
                    try { const url = await fazerUploadImagemSupabase(b64); dadosApp[mes].extratos.push(url); } catch(e) { mostrarToast("Erro no extrato", "❌"); }
                }
            }
            await salvarBancoSupabase(); renderizarExtratoPreview(); e.target.value = '';
        });

        // ===================== GERAÇÃO PDF =====================
        function formatarMesExtensoParaPDF(YYYY_MM) {
            if(!YYYY_MM) return '';
            const [ano, mes] = YYYY_MM.split('-');
            const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
            return `${meses[parseInt(mes)-1]} de ${ano}`;
        }

        function gerarRelatorio() {
            const mes = getMesRefAtual(); const info = dadosApp[mes] || { pensao: 0, gastos: [] };
            const totalGasto = info.gastos.reduce((a, c) => a + c.valor, 0); const saldo = (info.pensao || 0) - totalGasto;
            const area = document.getElementById('area-impressao');

            let html = `
                <div class="folha-capa">
                    <h1 style="font-size:22px;font-weight:800;margin-bottom:20px;">Relatório de Prestação de Contas - ${formatarMesExtensoParaPDF(mes)}</h1>
                    <table style="width:100%;border-collapse:collapse;font-size:14px; margin-bottom: 30px;">
                        <tr><td style="padding:12px 0;border-bottom:1px solid #eee;">Pensão Mensal</td><td style="padding:12px 0;text-align:right;font-weight:600;border-bottom:1px solid #eee;">${formatarMoeda(info.pensao)}</td></tr>
                        <tr><td style="padding:12px 0;border-bottom:1px solid #eee;">Total Gasto</td><td style="padding:12px 0;text-align:right;font-weight:600;border-bottom:1px solid #eee;">${formatarMoeda(totalGasto)}</td></tr>
                        <tr><td style="padding:12px 0;border-bottom:2px solid #000;"><strong>SALDO FINAL</strong></td><td style="padding:12px 0;text-align:right;font-weight:800;border-bottom:2px solid #000;">${formatarMoeda(saldo)}</td></tr>
                    </table>
                </div>
            `;

            info.gastos.slice().sort((a, b) => a.data.localeCompare(b.data)).forEach(g => {
                const imagensArr = []; if (g.foto) imagensArr.push(g.foto); if (g.fotosExtras) imagensArr.push(...g.fotosExtras);
                let htmlImagens = '';
                if (imagensArr.length > 0) {
                    htmlImagens = `<div style="display:flex;justify-content:center;gap:15px;width:100%;">`;
                    imagensArr.forEach(img => { htmlImagens += `<img src="${img}" style="flex:1; max-width:100%; max-height:75vh; object-fit:contain;">`; });
                    htmlImagens += `</div>`;
                }

                html += `
                    <div class="comprovante-box">
                        <div style="display:flex; justify-content:space-between; font-size:14px; margin-bottom:12px; font-family:sans-serif;">
                            <span><strong>Cat:</strong> ${escapeHtml(g.categoria)}</span><span><strong>Local:</strong> ${escapeHtml(g.local)}</span>
                            <span><strong>Data:</strong> ${formatarDataBR(g.data)}</span><span><strong>Valor:</strong> ${formatarMoeda(g.valor)}</span>
                        </div>
                        <div style="font-size: 14px; margin-bottom: 15px; font-family:sans-serif;"><strong>Ref:</strong> ${escapeHtml(g.justificativa)}</div>
                        ${htmlImagens}
                    </div>
                `;
            });
            
            if (info.extratos && info.extratos.length > 0) {
                html += `<div style="page-break-before:always;"><h2 style="font-family:sans-serif;text-align:center;">Extrato Bancário do Mês</h2></div>`;
                info.extratos.forEach(img => { html += `<div style="text-align:center; page-break-inside:avoid; margin-bottom:20px;"><img src="${img}" style="max-width:100%; max-height:90vh;"></div>`; });
            }
            area.innerHTML = html; setTimeout(() => window.print(), 300);
        }

        // Chave Gemini
        const geminiSalva = localStorage.getItem('geminiApiKey');
        if (geminiSalva) document.getElementById('gemini-key-input').value = geminiSalva;
        function salvarChaveGemini() { localStorage.setItem('geminiApiKey', document.getElementById('gemini-key-input').value.trim()); mostrarToast('Chave IA salva!', '✅'); }

        // Iniciar
        carregarBancoSupabase();

    </script>
</body>
</html>
