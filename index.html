<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Prestação Contas">
    <title>Prestação de Contas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        #area-impressao { display: none; }
        @media print {
            body * { visibility: hidden; }
            #area-impressao, #area-impressao * { visibility: visible; }
            #area-impressao { display: block; position: absolute; top: 0; left: 0; width: 100%; }
            .folha { page-break-after: always; padding: 28px; }
            .folha:last-child { page-break-after: auto; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-12">

    <div id="toast" class="fixed top-4 right-4 left-4 md:left-auto z-50 transform -translate-y-24 opacity-0 transition-all duration-300 bg-gray-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3">
        <span id="toast-icon">✨</span>
        <span id="toast-msg" class="text-sm font-medium"></span>
    </div>

    <div id="modal-zoom" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
        <div class="relative max-w-full max-h-full">
            <button onclick="fecharZoom()" class="absolute -top-10 right-0 text-white text-xl font-bold bg-gray-800 rounded-full w-8 h-8 flex items-center justify-center cursor-pointer">✕</button>
            <img id="img-zoom-conteudo" src="" class="max-w-full max-h-[85vh] object-contain rounded-lg">
        </div>
    </div>

    <div id="area-impressao"></div>

    <header class="bg-purple-700 text-white shadow-md pt-6 pb-6 px-4 mb-6 nao-imprimir">
        <div class="max-w-md mx-auto">
            <h1 class="text-xl font-bold mb-1 text-center">Prestação de Contas</h1>

            <div id="status-sync" class="text-center mb-3">
                <p class="text-xs text-purple-200">☁️ Verificando conexão com Google Drive...</p>
            </div>

            <div id="google-auth-area" class="mb-3">
                <button id="btn-google-login" onclick="entrarComGoogle()" class="w-full bg-white text-gray-800 font-medium py-2 rounded-lg text-xs transition cursor-pointer flex items-center justify-center gap-2 hover:bg-gray-100">
                    <span>🔐</span><span>Entrar com Google (Drive automático)</span>
                </button>
                <p id="google-status-text" class="text-center text-[11px] text-purple-200 mt-1"></p>
            </div>

            <div class="bg-purple-800/40 rounded-lg p-2.5 mb-3">
                <label class="block text-[10px] text-purple-200 mb-1">🔑 Chave da IA (Gemini) — cole uma vez, fica só neste aparelho</label>
                <div class="flex gap-2">
                    <input type="password" id="gemini-key-input" placeholder="Cole a chave do Google AI Studio" class="flex-1 bg-purple-800 border border-purple-500 rounded-lg px-2 py-1.5 text-white text-xs focus:outline-none focus:ring-2 focus:ring-white">
                    <button onclick="salvarChaveGemini()" class="bg-white/20 hover:bg-white/30 text-white text-xs px-3 rounded-lg cursor-pointer">Salvar</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                    <label class="block text-xs font-medium text-purple-200 mb-1">Mês Ref.</label>
                    <input type="text" id="mes-ref" value="Jul/2026" class="w-full bg-purple-800 border border-purple-500 rounded-lg px-3 py-2 text-white font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-white">
                </div>
                <div>
                    <label class="block text-xs font-medium text-purple-200 mb-1">Pensão Mensal</label>
                    <input type="text" id="valor-pensao" placeholder="R$ 0,00" class="w-full bg-purple-800 border border-purple-500 rounded-lg px-3 py-2 text-white font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-white">
                </div>
            </div>

            <div class="bg-purple-800/60 rounded-xl p-3 flex justify-between items-center text-sm border border-purple-600 mb-3">
                <div>
                    <p class="text-purple-200 text-xs">Total Gasto</p>
                    <p id="resumo-gasto" class="font-bold text-base">R$ 0,00</p>
                </div>
                <div class="text-right">
                    <p class="text-purple-200 text-xs">Saldo Restante</p>
                    <p id="resumo-saldo" class="font-bold text-base">R$ 0,00</p>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-2">
                <button onclick="compartilharGoogleDrive()" class="w-full bg-white/10 hover:bg-white/20 border border-purple-500 text-white font-medium py-2 rounded-lg text-xs transition cursor-pointer">
                    📤 Salvar backup no Google Drive
                </button>
                <label class="w-full bg-white/10 hover:bg-white/20 border border-purple-500 text-white font-medium py-2 rounded-lg text-xs transition cursor-pointer text-center block">
                    📥 Importar backup existente
                    <input type="file" id="input-importar" accept=".json" class="hidden">
                </label>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 space-y-6">

        <section class="bg-white rounded-2xl shadow-sm border border-purple-100 p-5 nao-imprimir">
            <h2 id="form-titulo" class="text-sm font-semibold text-gray-800 mb-4 flex items-center space-x-2">
                <span>📸 Novo Comprovante</span>
            </h2>

            <form id="gasto-form" class="space-y-4">
                <input type="hidden" id="edit-id" value="">

                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Comprovante Principal (Leitura por IA)</label>
                    <div class="relative border-2 border-dashed border-purple-200 rounded-xl p-4 text-center hover:bg-purple-50/50 transition cursor-pointer flex flex-col items-center justify-center">
                        <input type="file" id="foto-input" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
                        <div id="preview-container" class="hidden w-full h-32 mb-2 relative">
                            <img id="img-preview" src="" alt="Pré-visualização" class="w-full h-full object-contain rounded-lg cursor-pointer">
                            <div class="absolute top-1 right-1 flex space-x-1">
                                <button type="button" onclick="event.stopPropagation(); document.getElementById('foto-input').click();" class="bg-gray-900/80 hover:bg-gray-900 text-white text-[10px] font-medium px-2 py-1 rounded-lg cursor-pointer" title="Trocar foto">🔄 Trocar</button>
                                <button type="button" onclick="event.stopPropagation(); removerFotoPrincipal();" class="bg-red-600/90 hover:bg-red-600 text-white text-[10px] font-medium px-2 py-1 rounded-lg cursor-pointer" title="Remover foto">✕ Remover</button>
                            </div>
                        </div>
                        <div id="upload-placeholder" class="space-y-1">
                            <span class="text-2xl">📁</span>
                            <p class="text-xs font-medium text-purple-700">Tirar foto ou escolher recibo principal</p>
                            <p class="text-[10px] text-gray-400">A IA preencherá data, valor e justificativa</p>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Comprovantes Adicionais (Opcional)</label>
                    <input type="file" id="fotos-extras-input" accept="image/*" multiple class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100 cursor-pointer">
                    <div id="lista-extras-preview" class="flex flex-wrap gap-2 mt-2"></div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Data</label>
                        <input type="date" id="campo-data" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Valor (R$)</label>
                        <input type="number" step="0.01" id="campo-valor" placeholder="0,00" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Categoria</label>
                    <input type="text" id="campo-categoria" list="lista-categorias" placeholder="Ex: Farmácia, Alimentação..." class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600">
                    <datalist id="lista-categorias">
                        <option value="Alimentação">
                        <option value="Saúde / Farmácia">
                        <option value="Educação">
                        <option value="Vestuário">
                        <option value="Lazer">
                    </datalist>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Local / Favorecido (Preenchimento Manual)</label>
                    <input type="text" id="campo-local" placeholder="Ex: Supermercado Extra / Arthur Martins" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Justificativa / Descrição</label>
                    <textarea id="campo-justificativa" rows="2" placeholder="Ex: Compra de mantimentos essenciais" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-600"></textarea>
                </div>

                <div class="flex space-x-2">
                    <button type="button" id="btn-submit" onclick="salvarGasto()" class="flex-1 bg-purple-700 hover:bg-purple-800 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-sm cursor-pointer">
                        Salvar no Caderno
                    </button>
                    <button type="button" id="btn-cancelar-edicao" onclick="cancelarEdicao()" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-4 py-2.5 rounded-xl text-sm transition cursor-pointer">
                        Cancelar
                    </button>
                </div>
            </form>
        </section>

        <section class="space-y-3 nao-imprimir">
            <div class="flex justify-between items-center px-1">
                <h3 class="text-sm font-bold text-gray-800">Comprovantes do mês</h3>
                <span id="contador-itens" class="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full font-medium">0 itens</span>
            </div>

            <div id="lista-gastos" class="space-y-3"></div>
        </section>

        <section class="bg-white rounded-2xl shadow-sm border border-purple-100 p-5 nao-imprimir">
            <h3 class="text-sm font-semibold text-gray-800 mb-3">📑 Extrato Bancário do Mês</h3>
            <label class="w-full bg-purple-50 hover:bg-purple-100 border-2 border-dashed border-purple-200 text-purple-700 font-medium py-2.5 rounded-xl text-xs transition cursor-pointer text-center block mb-3">
                📎 Anexar página(s) do extrato
                <input type="file" id="extrato-input" accept="image/*" multiple class="hidden">
            </label>
            <div id="lista-extrato-preview" class="flex flex-wrap gap-2"></div>
        </section>

        <div class="pt-2 flex flex-col space-y-3 nao-imprimir">
            <button onclick="gerarRelatorio()" class="w-full max-w-xs mx-auto bg-purple-700 hover:bg-purple-800 text-white font-medium py-2.5 px-6 rounded-xl text-sm transition shadow-md flex items-center justify-center space-x-2 cursor-pointer">
                <span>📄</span>
                <span>Gerar Relatório PDF do Mês</span>
            </button>
        </div>

    </main>

    <script>
        // ===================== ESTADO =====================
        const GOOGLE_CLIENT_ID = '479453349579-mer1ktrk4hn55aadu029tcmcb9u5bn9a.apps.googleusercontent.com';
        const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
        const LS_KEY = 'prestacao_contas_dados_v2';
        let dadosApp = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
        let imagemBase64Atual = '';
        let fotosExtrasArray = [];

        const mesRefInput = document.getElementById('mes-ref');
        const valorPensaInput = document.getElementById('valor-pensao');
        const fotoInput = document.getElementById('foto-input');
        const fotosExtrasInput = document.getElementById('fotos-extras-input');
        const imgPreview = document.getElementById('img-preview');
        const previewContainer = document.getElementById('preview-container');
        const uploadPlaceholder = document.getElementById('upload-placeholder');
        const listaExtrasPreview = document.getElementById('lista-extras-preview');
        const gastoForm = document.getElementById('gasto-form');
        const inputImportar = document.getElementById('input-importar');
        const extratoInput = document.getElementById('extrato-input');
        const listaExtratoPreview = document.getElementById('lista-extrato-preview');

        // ===================== HELPERS =====================
        function mostrarToast(mensagem, icone = '✨') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-icon').innerText = icone;
            document.getElementById('toast-msg').innerText = mensagem;
            toast.classList.remove('-translate-y-24', 'opacity-0');
            setTimeout(() => toast.classList.add('-translate-y-24', 'opacity-0'), 3500);
        }

        function abrirZoom(src) {
            document.getElementById('img-zoom-conteudo').src = src;
            document.getElementById('modal-zoom').classList.remove('hidden');
            document.getElementById('modal-zoom').classList.add('flex');
        }
        function fecharZoom() {
            document.getElementById('modal-zoom').classList.add('hidden');
            document.getElementById('modal-zoom').classList.remove('flex');
        }

        function obterMesAtual() { return mesRefInput.value || 'Jul/2026'; }
        function formatarMoeda(valor) { return (valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
        function formatarDataBR(iso) {
            if (!iso) return '';
            const [a, m, d] = iso.split('-');
            return `${d}/${m}/${a}`;
        }
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.innerText = str || '';
            return div.innerHTML;
        }

        // Comprime a imagem antes de guardar/enviar pra IA — mantém boa leitura, arquivo leve
        function comprimirImagem(file, maxWidth = 1400, quality = 0.75) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > maxWidth) {
                            height = Math.round(height * (maxWidth / width));
                            width = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ===================== PERSISTÊNCIA =====================
        const NOME_ARQUIVO = 'prestacao_contas_dados.json';

        let tokenClient = null;
        let googleAccessToken = null;
        let driveFileId = null;

        function garantirTokenClient() {
            if (tokenClient) return true;
            if (!(window.google && google.accounts && google.accounts.oauth2)) return false;
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: DRIVE_SCOPE,
                callback: (resp) => {
                    if (resp.error) {
                        mostrarToast('Não foi possível conectar ao Google.', '⚠️');
                        return;
                    }
                    googleAccessToken = resp.access_token;
                    atualizarStatusGoogle(true);
                    sincronizarComDrive();
                }
            });
            return true;
        }

        function entrarComGoogle() {
            if (!garantirTokenClient()) {
                mostrarToast('Carregando login do Google, tente de novo em instantes.', '⏳');
                return;
            }
            tokenClient.requestAccessToken({ prompt: googleAccessToken ? '' : 'consent' });
        }

        function atualizarStatusGoogle(conectado) {
            const btn = document.getElementById('btn-google-login');
            const status = document.getElementById('google-status-text');
            if (conectado) {
                btn.innerHTML = '<span>🔄</span><span>Sincronizar agora</span>';
                status.innerText = '✅ Conectado ao Google Drive';
            } else {
                btn.innerHTML = '<span>🔐</span><span>Entrar com Google (Drive automático)</span>';
                status.innerText = '';
            }
        }

        async function chamarDriveAPI(url, options = {}) {
            options.headers = Object.assign({}, options.headers, { Authorization: 'Bearer ' + googleAccessToken });
            let resp = await fetch(url, options);
            if (resp.status === 401 && tokenClient) {
                await new Promise((resolve) => {
                    const callbackAnterior = tokenClient.callback;
                    tokenClient.callback = (r) => {
                        if (!r.error) googleAccessToken = r.access_token;
                        resolve();
                    };
                    tokenClient.requestAccessToken({ prompt: '' });
                    tokenClient.callback = callbackAnterior;
                });
                options.headers.Authorization = 'Bearer ' + googleAccessToken;
                resp = await fetch(url, options);
            }
            return resp;
        }

        async function localizarOuCriarArquivoDrive() {
            const busca = await chamarDriveAPI(`https://www.googleapis.com/drive/v3/files?q=name%3D%27${NOME_ARQUIVO}%27%20and%20trashed%3Dfalse&spaces=drive&fields=files(id,name)`);
            const dadosBusca = await busca.json();
            if (dadosBusca.files && dadosBusca.files.length > 0) {
                driveFileId = dadosBusca.files[0].id;
                return;
            }
            const metadata = { name: NOME_ARQUIVO, mimeType: 'application/json' };
            const boundary = 'limite_prestacao_contas';
            const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(dadosApp)}\r\n--${boundary}--`;
            const criar = await chamarDriveAPI('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
                method: 'POST',
                headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
                body
            });
            const criado = await criar.json();
            driveFileId = criado.id;
        }

        async function sincronizarComDrive() {
            try {
                await localizarOuCriarArquivoDrive();
                const resp = await chamarDriveAPI(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`);
                const texto = await resp.text();
                if (texto && texto.trim()) {
                    const dadosDrive = JSON.parse(texto);
                    if (dadosDrive && Object.keys(dadosDrive).length > 0) {
                        dadosApp = dadosDrive;
                        localStorage.setItem(LS_KEY, JSON.stringify(dadosApp));
                        carregarDadosMes();
                    }
                }
                marcarBackupFeito();
                mostrarToast('Dados sincronizados com o Google Drive!', '☁️');
            } catch (e) {
                console.error(e);
                mostrarToast('Erro ao sincronizar com o Drive.', '⚠️');
            }
        }

        async function salvarNoDrive() {
            if (!googleAccessToken || !driveFileId) return;
            try {
                await chamarDriveAPI(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosApp)
                });
                marcarBackupFeito();
            } catch (e) { console.error('Erro ao salvar no Drive:', e); }
        }

        function salvarChaveGemini() {
            const v = document.getElementById('gemini-key-input').value.trim();
            if (!v) { mostrarToast('Cole a chave antes de salvar.', '⚠️'); return; }
            localStorage.setItem('geminiApiKey', v);
            mostrarToast('Chave da IA salva neste aparelho!', '🔑');
        }

        function persistirDados() {
            localStorage.setItem(LS_KEY, JSON.stringify(dadosApp)); // cache local instantâneo
            salvarNoDrive(); // salva no Google Drive se estiver conectada (não bloqueia a interface)
            const contador = parseInt(localStorage.getItem('alteracoesDesdeBackup') || '0', 10) + 1;
            localStorage.setItem('alteracoesDesdeBackup', String(contador));
            atualizarStatusBackup();
        }

        function atualizarStatusBackup() {
            const el = document.getElementById('status-sync');
            const ts = localStorage.getItem('ultimoBackupTs');
            const contador = parseInt(localStorage.getItem('alteracoesDesdeBackup') || '0', 10);
            if (contador === 0 && ts) {
                const data = new Date(parseInt(ts, 10));
                el.innerHTML = `<p class="text-xs text-purple-200">✅ Backup em dia • salvo em ${data.toLocaleDateString('pt-BR')} às ${data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</p>`;
            } else if (contador > 0) {
                el.innerHTML = `<p class="text-xs text-amber-300">⚠️ ${contador} alteração(ões) desde o último backup — toque em "Salvar backup" abaixo</p>`;
            } else {
                el.innerHTML = `<p class="text-xs text-purple-200">☁️ Nenhum backup feito ainda — toque em "Salvar backup" abaixo</p>`;
            }
        }

        function marcarBackupFeito() {
            localStorage.setItem('ultimoBackupTs', String(Date.now()));
            localStorage.setItem('alteracoesDesdeBackup', '0');
            atualizarStatusBackup();
        }

        // Salvar via menu de compartilhamento nativo (funciona bem no iPhone) ou download (notebook)
        async function compartilharGoogleDrive() {
            const dataStr = JSON.stringify(dadosApp, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const file = new File([blob], NOME_ARQUIVO, { type: 'application/json' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ files: [file], title: 'Backup Prestação de Contas' });
                    marcarBackupFeito();
                    mostrarToast('Escolha "Salvar no Google Drive" na lista.', '📤');
                } catch (e) { /* usuário cancelou, tudo bem */ }
            } else {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = NOME_ARQUIVO;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                marcarBackupFeito();
                mostrarToast('Baixe o arquivo e mova para a pasta do Google Drive.', '📥');
            }
        }

        inputImportar.addEventListener('change', async function (e) {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const texto = await file.text();
                const dadosImportados = JSON.parse(texto);
                if (!confirm('Isso vai substituir os dados atuais deste dispositivo pelos dados do arquivo importado. Confirmar?')) return;
                dadosApp = dadosImportados;
                localStorage.setItem(LS_KEY, JSON.stringify(dadosApp));
                marcarBackupFeito();
                carregarDadosMes();
                mostrarToast('Backup importado com sucesso!', '✅');
            } catch (err) {
                mostrarToast('Arquivo inválido. Verifique se é o backup correto.', '⚠️');
            }
            inputImportar.value = '';
        });

        // ===================== MÊS / PENSÃO =====================
        function carregarDadosMes() {
            const mes = obterMesAtual();
            if (!dadosApp[mes]) dadosApp[mes] = { pensao: 0, gastos: [] };
            if (!dadosApp[mes].extratos) dadosApp[mes].extratos = [];
            valorPensaInput.value = formatarMoeda(dadosApp[mes].pensao || 0);
            renderizarTela();
            renderizarExtratoPreview();
        }
        mesRefInput.addEventListener('change', carregarDadosMes);

        valorPensaInput.addEventListener('input', (e) => {
            let val = e.target.value.replace(/\D/g, '');
            let num = (parseFloat(val) || 0) / 100;
            valorPensaInput.value = formatarMoeda(num);
            const mes = obterMesAtual();
            if (!dadosApp[mes]) dadosApp[mes] = { pensao: 0, gastos: [] };
            dadosApp[mes].pensao = num;
            persistirDados();
            atualizarResumo();
        });

        // ===================== FOTOS =====================
        function renderizarExtrasPreview() {
            listaExtrasPreview.innerHTML = '';
            fotosExtrasArray.forEach((base64, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = "relative";
                wrapper.innerHTML = `
                    <img src="${base64}" class="w-14 h-14 object-cover rounded-lg border border-purple-200 cursor-pointer">
                    <button type="button" class="absolute -top-1.5 -right-1.5 bg-red-600 hover:bg-red-700 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center cursor-pointer leading-none">✕</button>
                `;
                wrapper.querySelector('img').onclick = () => abrirZoom(base64);
                wrapper.querySelector('button').onclick = () => {
                    fotosExtrasArray.splice(idx, 1);
                    renderizarExtrasPreview();
                };
                listaExtrasPreview.appendChild(wrapper);
            });
        }

        function removerFotoPrincipal() {
            imagemBase64Atual = '';
            imgPreview.src = '';
            previewContainer.classList.add('hidden');
            uploadPlaceholder.classList.remove('hidden');
            fotoInput.value = '';
            mostrarToast('Foto removida. Escolha outra ou salve sem foto.', '🗑️');
        }

        function renderizarExtratoPreview() {
            const mes = obterMesAtual();
            const extratos = (dadosApp[mes] && dadosApp[mes].extratos) || [];
            listaExtratoPreview.innerHTML = '';
            if (extratos.length === 0) {
                listaExtratoPreview.innerHTML = `<p class="text-xs text-gray-400">Nenhuma página anexada ainda para ${mes}.</p>`;
                return;
            }
            extratos.forEach((base64, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = "relative";
                wrapper.innerHTML = `
                    <img src="${base64}" class="w-16 h-16 object-cover rounded-lg border border-purple-200 cursor-pointer">
                    <button type="button" class="absolute -top-1.5 -right-1.5 bg-red-600 hover:bg-red-700 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center cursor-pointer leading-none">✕</button>
                `;
                wrapper.querySelector('img').onclick = () => abrirZoom(base64);
                wrapper.querySelector('button').onclick = () => {
                    dadosApp[mes].extratos.splice(idx, 1);
                    persistirDados();
                    renderizarExtratoPreview();
                };
                listaExtratoPreview.appendChild(wrapper);
            });
        }

        extratoInput.addEventListener('change', async function (e) {
            const mes = obterMesAtual();
            if (!dadosApp[mes]) dadosApp[mes] = { pensao: 0, gastos: [] };
            if (!dadosApp[mes].extratos) dadosApp[mes].extratos = [];
            const files = Array.from(e.target.files);
            for (const file of files) {
                const base64 = await comprimirImagem(file, 1600, 0.8);
                dadosApp[mes].extratos.push(base64);
            }
            persistirDados();
            renderizarExtratoPreview();
            e.target.value = '';
        });

        fotosExtrasInput.addEventListener('change', async function (e) {
            const files = Array.from(e.target.files);
            for (const file of files) {
                const base64 = await comprimirImagem(file);
                fotosExtrasArray.push(base64);
            }
            renderizarExtrasPreview();
            e.target.value = '';
        });

        function normalizarValor(v) {
            if (typeof v === 'number' && !isNaN(v)) return v;
            if (v === null || v === undefined || v === '') return 0;
            let s = String(v).replace(/[^\d,.-]/g, '');
            if (s.includes(',') && s.includes('.')) {
                s = s.replace(/\./g, '').replace(',', '.');
            } else if (s.includes(',')) {
                s = s.replace(',', '.');
            }
            const n = parseFloat(s);
            return isNaN(n) ? 0 : n;
        }

        function normalizarData(v) {
            if (!v) return '';
            const s = String(v).trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
            const br = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
            if (br) return `${br[3]}-${br[2]}-${br[1]}`;
            return '';
        }

        async function chamarIAComRetry(base64DataUrl, tentativa = 1) {
            const apiKey = localStorage.getItem('geminiApiKey');
            if (!apiKey) {
                mostrarToast('Configure sua chave da IA (Gemini) no topo do app antes de usar essa função.', '🔑');
                throw new Error('Chave do Gemini não configurada');
            }
            const base64Data = base64DataUrl.split(',')[1];
            const promptSistema = 'Você é um assistente que extrai dados de comprovantes de pagamento brasileiros. Responda APENAS com um objeto JSON puro (sem markdown, sem crases, sem texto antes ou depois) no formato exato: {"data":"YYYY-MM-DD","valor":0.00,"categoria":"categoria curta","justificativa":"breve descrição do gasto baseada no comprovante"}. Se não identificar um campo com confiança, use "" ou 0.';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: promptSistema + '\n\nExtraia os dados deste comprovante.' },
                                { inline_data: { mime_type: 'image/jpeg', data: base64Data } }
                            ]
                        }],
                        generationConfig: { responseMimeType: 'application/json' }
                    })
                });
                if (!response.ok) throw new Error('Erro na API do Gemini: ' + response.status);
                const data = await response.json();
                let text = data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text || '{}';
                text = text.replace(/```json|```/g, '').trim();
                return JSON.parse(text);
            } catch (error) {
                if (tentativa <= 2) {
                    await new Promise(r => setTimeout(r, Math.pow(2, tentativa) * 1000));
                    return chamarIAComRetry(base64DataUrl, tentativa + 1);
                }
                throw error;
            }
        }

        fotoInput.addEventListener('change', async function (e) {
            const file = e.target.files[0];
            if (!file) return;
            const base64 = await comprimirImagem(file);
            imagemBase64Atual = base64;
            imgPreview.src = base64;
            imgPreview.onclick = () => abrirZoom(base64);
            previewContainer.classList.remove('hidden');
            uploadPlaceholder.classList.add('hidden');

            mostrarToast('IA analisando o comprovante...', '🤖');
            try {
                const dadosExtraidos = await chamarIAComRetry(base64);
                if (dadosExtraidos.data) document.getElementById('campo-data').value = normalizarData(dadosExtraidos.data);
                if (dadosExtraidos.valor !== undefined && dadosExtraidos.valor !== null && dadosExtraidos.valor !== '') {
                    document.getElementById('campo-valor').value = normalizarValor(dadosExtraidos.valor);
                }
                if (dadosExtraidos.categoria) document.getElementById('campo-categoria').value = dadosExtraidos.categoria;
                if (dadosExtraidos.justificativa) document.getElementById('campo-justificativa').value = dadosExtraidos.justificativa;
                mostrarToast('Comprovante lido com sucesso!', '✅');
            } catch (err) {
                mostrarToast('Não consegui ler automaticamente. Preencha manualmente.', '⚠️');
            }
        });

        // ===================== FORM =====================
        function salvarGasto() {
            const mes = obterMesAtual();
            const editId = document.getElementById('edit-id').value;

            const dataVal = document.getElementById('campo-data').value;
            const valorVal = parseFloat(document.getElementById('campo-valor').value);
            const categoriaVal = document.getElementById('campo-categoria').value.trim();
            const justificativaVal = document.getElementById('campo-justificativa').value.trim();

            if (!dataVal) { mostrarToast('Preencha a Data antes de salvar.', '⚠️'); return; }
            if (!valorVal || valorVal <= 0) { mostrarToast('Preencha um Valor válido antes de salvar.', '⚠️'); return; }
            if (!categoriaVal) { mostrarToast('Preencha a Categoria antes de salvar.', '⚠️'); return; }
            if (!justificativaVal) { mostrarToast('Preencha a Justificativa antes de salvar.', '⚠️'); return; }

            const dadosGasto = {
                id: editId ? Number(editId) : Date.now(),
                data: dataVal,
                valor: valorVal,
                categoria: categoriaVal,
                local: document.getElementById('campo-local').value.trim(),
                justificativa: justificativaVal,
                foto: imagemBase64Atual,
                fotosExtras: [...fotosExtrasArray]
            };

            if (editId) {
                const index = dadosApp[mes].gastos.findIndex(g => g.id === Number(editId));
                if (index !== -1) {
                    if (!imagemBase64Atual && dadosApp[mes].gastos[index].foto) dadosGasto.foto = dadosApp[mes].gastos[index].foto;
                    if (fotosExtrasArray.length === 0 && dadosApp[mes].gastos[index].fotosExtras) dadosGasto.fotosExtras = dadosApp[mes].gastos[index].fotosExtras;
                    dadosApp[mes].gastos[index] = dadosGasto;
                }
                mostrarToast('Gasto atualizado!', '✏️');
            } else {
                dadosApp[mes].gastos.push(dadosGasto);
                mostrarToast('Adicionado ao caderno!', '📁');
            }

            persistirDados();
            renderizarTela();
            cancelarEdicao();
        }

        function editarGasto(id) {
            const mes = obterMesAtual();
            const gasto = dadosApp[mes].gastos.find(g => g.id === id);
            if (!gasto) return;

            document.getElementById('edit-id').value = gasto.id;
            document.getElementById('campo-data').value = gasto.data;
            document.getElementById('campo-valor').value = gasto.valor;
            document.getElementById('campo-categoria').value = gasto.categoria;
            document.getElementById('campo-local').value = gasto.local;
            document.getElementById('campo-justificativa').value = gasto.justificativa;

            if (gasto.foto) {
                imagemBase64Atual = gasto.foto;
                imgPreview.src = gasto.foto;
                imgPreview.onclick = () => abrirZoom(gasto.foto);
                previewContainer.classList.remove('hidden');
                uploadPlaceholder.classList.add('hidden');
            }

            fotosExtrasArray = gasto.fotosExtras ? [...gasto.fotosExtras] : [];
            renderizarExtrasPreview();

            document.getElementById('form-titulo').innerHTML = '<span>✏️ Editando Comprovante</span>';
            document.getElementById('btn-submit').innerText = 'Salvar Alterações';
            document.getElementById('btn-cancelar-edicao').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicao() {
            gastoForm.reset();
            document.getElementById('edit-id').value = '';
            previewContainer.classList.add('hidden');
            uploadPlaceholder.classList.remove('hidden');
            listaExtrasPreview.innerHTML = '';
            imagemBase64Atual = '';
            fotosExtrasArray = [];
            document.getElementById('form-titulo').innerHTML = '<span>📸 Novo Comprovante</span>';
            document.getElementById('btn-submit').innerText = 'Salvar no Caderno';
            document.getElementById('btn-cancelar-edicao').classList.add('hidden');
        }

        function deletarGasto(id) {
            if (confirm('Tem certeza que deseja excluir este comprovante?')) {
                const mes = obterMesAtual();
                dadosApp[mes].gastos = dadosApp[mes].gastos.filter(g => g.id !== id);
                persistirDados();
                renderizarTela();
                mostrarToast('Registro removido.', '🗑️');
            }
        }

        // ===================== RENDER =====================
        function atualizarResumo() {
            const mes = obterMesAtual();
            const info = dadosApp[mes] || { pensao: 0, gastos: [] };
            const totalGasto = info.gastos.reduce((acc, curr) => acc + curr.valor, 0);
            const saldo = (info.pensao || 0) - totalGasto;
            document.getElementById('resumo-gasto').innerText = formatarMoeda(totalGasto);
            const saldoEl = document.getElementById('resumo-saldo');
            saldoEl.innerText = formatarMoeda(saldo);
            saldoEl.className = "font-bold text-base " + (saldo < 0 ? "text-red-300" : "text-white");
        }

        function renderizarTela() {
            const mes = obterMesAtual();
            const info = dadosApp[mes] || { pensao: 0, gastos: [] };
            const listaContainer = document.getElementById('lista-gastos');
            document.getElementById('contador-itens').innerText = `${info.gastos.length} itens`;

            if (info.gastos.length === 0) {
                listaContainer.innerHTML = `<div class="bg-white rounded-xl p-6 text-center border border-dashed border-gray-200"><p class="text-xs text-gray-400">Nenhum comprovante cadastrado para ${mes}.</p></div>`;
                atualizarResumo();
                return;
            }

            listaContainer.innerHTML = '';
            info.gastos.slice().sort((a, b) => (b.data || '').localeCompare(a.data || '')).forEach(gasto => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex flex-col space-y-3 relative";

                let htmlExtras = '';
                if (gasto.fotosExtras && gasto.fotosExtras.length > 0) {
                    htmlExtras = `<div class="mt-2"><p class="text-[10px] text-gray-400 mb-1">Comprovantes Adicionais:</p><div class="flex flex-wrap gap-2">`;
                    gasto.fotosExtras.forEach(ext => {
                        htmlExtras += `<img src="${ext}" alt="Extra" onclick="abrirZoom('${ext}')" class="w-16 h-16 object-cover rounded-lg border border-gray-200 bg-gray-900 cursor-pointer hover:opacity-90">`;
                    });
                    htmlExtras += `</div></div>`;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[10px] uppercase tracking-wider font-semibold bg-purple-50 text-purple-700 px-2 py-0.5 rounded">${escapeHtml(gasto.categoria)}</span>
                            <h4 class="font-bold text-gray-800 text-sm mt-1">${escapeHtml(gasto.local)}</h4>
                            <p class="text-xs text-gray-500">${formatarDataBR(gasto.data)} • ${formatarMoeda(gasto.valor)}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="editarGasto(${gasto.id})" class="text-gray-400 hover:text-purple-600 p-1.5 rounded-lg hover:bg-purple-50 transition cursor-pointer" title="Editar">✏️</button>
                            <button onclick="deletarGasto(${gasto.id})" class="text-gray-400 hover:text-red-500 p-1.5 rounded-lg hover:bg-red-50 transition cursor-pointer" title="Excluir">🗑️</button>
                        </div>
                    </div>
                    <p class="text-xs text-gray-600 bg-gray-50 p-2 rounded-lg italic">"${escapeHtml(gasto.justificativa)}"</p>
                    ${gasto.foto ? `
                        <div class="mt-1">
                            <p class="text-[10px] text-gray-400 mb-1">Comprovante Principal (toque para ampliar):</p>
                            <img src="${gasto.foto}" alt="Comprovante" onclick="abrirZoom('${gasto.foto}')" class="w-full h-40 object-contain rounded-lg border border-gray-200 bg-gray-900 cursor-pointer hover:opacity-95">
                        </div>
                    ` : ''}
                    ${htmlExtras}
                `;
                listaContainer.appendChild(card);
            });

            atualizarResumo();
        }

        // ===================== RELATÓRIO PDF =====================
        function gerarRelatorio() {
            const mes = obterMesAtual();
            const info = dadosApp[mes] || { pensao: 0, gastos: [] };
            const totalGasto = info.gastos.reduce((a, c) => a + c.valor, 0);
            const saldo = (info.pensao || 0) - totalGasto;
            const area = document.getElementById('area-impressao');

            let html = `
                <div class="folha">
                    <h1 style="font-size:22px;font-weight:800;margin-bottom:4px;">Prestação de Contas</h1>
                    <p style="color:#666;margin-bottom:24px;font-size:13px;">Referência: ${escapeHtml(mes)} • Gerado em ${new Date().toLocaleDateString('pt-BR')}</p>
                    <table style="width:100%;border-collapse:collapse;font-size:13px;">
                        <tr><td style="padding:8px 0;color:#666;border-bottom:1px solid #eee;">Pensão do mês</td><td style="padding:8px 0;text-align:right;font-weight:600;border-bottom:1px solid #eee;">${formatarMoeda(info.pensao || 0)}</td></tr>
                        <tr><td style="padding:8px 0;color:#666;border-bottom:1px solid #eee;">Total gasto</td><td style="padding:8px 0;text-align:right;font-weight:600;border-bottom:1px solid #eee;">${formatarMoeda(totalGasto)}</td></tr>
                        <tr><td style="padding:8px 0;color:#666;border-bottom:1px solid #eee;">Saldo</td><td style="padding:8px 0;text-align:right;font-weight:700;color:${saldo < 0 ? '#dc2626' : '#111'};border-bottom:1px solid #eee;">${formatarMoeda(saldo)}</td></tr>
                        <tr><td style="padding:8px 0;color:#666;">Nº de comprovantes</td><td style="padding:8px 0;text-align:right;font-weight:600;">${info.gastos.length}</td></tr>
                    </table>
                </div>
            `;

            info.gastos.slice().sort((a, b) => (a.data || '').localeCompare(b.data || '')).forEach((g, idx) => {
                const imagensArr = [];
                if (g.foto) imagensArr.push(g.foto);
                if (g.fotosExtras && g.fotosExtras.length) imagensArr.push(...g.fotosExtras);
                let imagens = '';
                if (imagensArr.length > 0) {
                    imagens = `<div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));gap:10px;margin-top:12px;align-items:start;">`;
                    imagensArr.forEach(img => {
                        imagens += `<img src="${img}" style="width:100%;height:auto;display:block;border:1px solid #ddd;border-radius:6px;">`;
                    });
                    imagens += `</div>`;
                }
                html += `
                    <div class="folha">
                        <p style="font-size:11px;color:#999;margin-bottom:6px;">Comprovante ${idx + 1} de ${info.gastos.length}</p>
                        <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #6d28d9;padding-bottom:10px;margin-bottom:10px;">
                            <div>
                                <span style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;background:#f3e8ff;color:#6d28d9;padding:2px 8px;border-radius:4px;">${escapeHtml(g.categoria)}</span>
                                <h2 style="font-size:16px;font-weight:700;margin-top:6px;">${escapeHtml(g.local)}</h2>
                                <p style="font-size:12px;color:#666;">${formatarDataBR(g.data)}</p>
                            </div>
                            <div style="font-size:18px;font-weight:700;color:#6d28d9;white-space:nowrap;">${formatarMoeda(g.valor)}</div>
                        </div>
                        <p style="font-size:13px;color:#444;background:#f9f9f9;padding:10px;border-radius:6px;font-style:italic;">"${escapeHtml(g.justificativa)}"</p>
                        ${imagens}
                    </div>
                `;
            });

            const extratos = info.extratos || [];
            if (extratos.length > 0) {
                html += `
                    <div class="folha">
                        <h1 style="font-size:20px;font-weight:800;margin-bottom:6px;">📑 Extrato Bancário</h1>
                        <p style="color:#666;font-size:13px;">Referência: ${escapeHtml(mes)} • ${extratos.length} página(s)</p>
                    </div>
                `;
                extratos.forEach((ext, i) => {
                    html += `
                        <div class="folha">
                            <p style="font-size:11px;color:#999;margin-bottom:8px;">Extrato — página ${i + 1} de ${extratos.length}</p>
                            <img src="${ext}" style="max-width:100%;max-height:900px;object-fit:contain;border:1px solid #ddd;border-radius:6px;display:block;margin:0 auto;">
                        </div>
                    `;
                });
            }

            area.innerHTML = html;
            setTimeout(() => window.print(), 100);
        }

        // ===================== INICIALIZAÇÃO =====================
        const chaveGeminiSalva = localStorage.getItem('geminiApiKey');
        if (chaveGeminiSalva) document.getElementById('gemini-key-input').value = chaveGeminiSalva;
        carregarDadosMes();
        atualizarStatusBackup();
    </script>
</body>
</html>
