<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Contas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Identity Services para autenticação -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-6">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold text-purple-800">Prestação de Contas</h1>
            <button id="btn-login" onclick="loginGoogle()" class="text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded-full text-gray-700 font-semibold transition">Conectar Google</button>
        </div>
        
        <div class="space-y-4">
            <input type="text" id="mes" placeholder="Mês (Ex: Jul/2026)" class="w-full border p-2 rounded focus:ring-2 focus:ring-purple-500 outline-none">
            <input type="number" id="pensao" placeholder="Pensão Recebida (R$)" class="w-full border p-2 rounded focus:ring-2 focus:ring-purple-500 outline-none">
            <button onclick="cadastrarGasto()" class="w-full bg-purple-600 text-white p-3 rounded-lg font-bold hover:bg-purple-700 transition shadow-md">Adicionar Gasto</button>
            <button onclick="salvarNoGoogleDrive()" class="w-full bg-emerald-600 text-white p-3 rounded-lg font-bold hover:bg-emerald-700 transition shadow-md flex items-center justify-center gap-2">
                <span>Salvar no Google Drive</span>
            </button>
            <button onclick="gerarPDF()" class="w-full bg-black text-white p-3 rounded-lg hover:bg-gray-800 transition">Gerar Relatório PDF</button>
            <button onclick="exportarDados()" class="w-full bg-blue-500 text-white p-3 rounded-lg hover:bg-blue-600 transition">Exportar Backup Local (.json)</button>
        </div>

        <div id="lista" class="mt-6 space-y-2"></div>
    </div>

    <script>
        let gastos = JSON.parse(localStorage.getItem('gastos') || '[]');
        let accessToken = null;

        // Configuração do Google OAuth (Substitua 'SEU_CLIENT_ID' pelo seu ID de Cliente gerado no Google Cloud Console)
        const CLIENT_ID = 'SEU_CLIENT_ID.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';

        function loginGoogle() {
            const client = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (response) => {
                    if (response.error !== undefined) {
                        alert('Erro ao conectar com o Google');
                        return;
                    }
                    accessToken = response.access_token;
                    document.getElementById('btn-login').innerText = 'Google Conectado ✅';
                    document.getElementById('btn-login').className = 'text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-semibold';
                    alert('Conta Google conectada com sucesso!');
                },
            });
            client.requestAccessToken();
        }

        async function salvarNoGoogleDrive() {
            if (!accessToken) {
                alert('Por favor, clique em "Conectar Google" antes de salvar no Drive.');
                loginGoogle();
                return;
            }

            const metadata = {
                name: `Prestacao_Contas_${new Date().toISOString().split('T')[0]}.json`,
                mimeType: 'application/json'
            };

            const fileContent = JSON.stringify(gastos, null, 2);
            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', new Blob([fileContent], { type: 'application/json' }));

            try {
                const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                    method: 'POST',
                    headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
                    body: form,
                });

                if (response.ok) {
                    alert('Backup salvo com sucesso no seu Google Drive!');
                } else {
                    alert('Erro ao salvar no Google Drive. Verifique sua conexão.');
                }
            } catch (error) {
                console.error(error);
                alert('Erro de conexão ao tentar salvar no Drive.');
            }
        }

        function cadastrarGasto() {
            const mesInput = document.getElementById('mes').value;
            const valor = parseFloat(document.getElementById('pensao').value) || 0;
            
            if (!mesInput) {
                alert('Por favor, informe o mês.');
                return;
            }

            const gasto = {
                data: new Date().toLocaleDateString(),
                valor: valor,
                descricao: 'Gasto de ' + mesInput
            };
            gastos.push(gasto);
            localStorage.setItem('gastos', JSON.stringify(gastos));
            
            // Limpa os campos
            document.getElementById('mes').value = '';
            document.getElementById('pensao').value = '';
            renderizar();
        }

        function renderizar() {
            const lista = document.getElementById('lista');
            lista.innerHTML = gastos.map(g => `<div class="p-3 bg-gray-50 border rounded-lg flex justify-between items-center">
                <span class="text-gray-700">${g.descricao}</span>
                <span class="font-bold text-gray-900">R$ ${g.valor.toFixed(2)}</span>
            </div>`).join('');
        }

        function exportarDados() {
            const blob = new Blob([JSON.stringify(gastos, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'backup_contas.json';
            a.click();
        }

        function gerarPDF() { 
            window.print(); 
        }

        renderizar();
    </script>
</body>
</html>
